name: dpo-training
version: v1
type: custom
config:
  dpo_config:
    build_name: "dpo"
    model_path: "ibm-granite/granite-4.0-350m-base"
    hf_token: ""
    dataset_mixer_list: ""
    dataset_train_splits: "train"
    chat_template_name: "tulu"
    checkpoint_s3_uri: "s3://granite-build-checkpoints"
    num_train_epochs: "3"
    per_device_train_batch_size: "1"
    gradient_accumulation_steps: "16"
    learning_rate: "5e-7"
    lr_scheduler_type: "linear"
    dpo_beta: "0.1"
    dpo_loss_type: "dpo_norm"
    max_seq_length: "2048"
    max_prompt_length: "1024"
    seed: "123"
    with_tracking: "false"
    report_to: "wandb"
    wandb_project: "granite-dpo-aws"
    wandb_api_key: ""
    logging_steps: "1"
    short_name: "g4-350m-dpo"
inputs:
  optional:
    model:
      type: model
      accept: [uri, binding]
outputs:
  optional:
    checkpoint:
      type: model
environment_configs:
  Skypilot:
    default_launcher: dpo-training
    launchers:
      dpo-training:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          # VERIFY before the first real run: this targets
          # open_instruct/dpo_tune_cache.py, which is confirmed present
          # upstream (allenai/open-instruct main — dataset_mixer_list-based
          # chosen/rejected preference CLI) but NOT confirmed to match this
          # pinned image's fork. finetune.py in this same image family
          # diverged from upstream's CLI (pre-tokenized --tokenized_data vs.
          # upstream's on-the-fly --dataset_mixer_list) — dpo_tune_cache.py
          # may have forked the same way. Confirm the actual argparse surface
          # inside the image (`python -c
          # "import open_instruct.dpo_tune_cache"`) before the first real run.
          image_id: "docker:022767362696.dkr.ecr.us-east-2.amazonaws.com/granite-build/open-instruct-tuning:0.1.0-conda"
          resources:
            infra: aws/us-east-2
            accelerators: "A10G:1"
            memory: "64+"
            disk_size: 256
          file_mounts:
            /output:
              source: "{{ config.dpo_config.checkpoint_s3_uri }}"
              mode: MOUNT
          envs:
            SKYPILOT_DOCKER_USERNAME: "AWS"
            SKYPILOT_DOCKER_SERVER: "022767362696.dkr.ecr.us-east-2.amazonaws.com"
            MODEL_PATH: "{{ config.dpo_config.model_path }}"
            HF_TOKEN: "{{ config.dpo_config.hf_token }}"
            DATASET_MIXER_LIST: "{{ config.dpo_config.dataset_mixer_list }}"
            DATASET_TRAIN_SPLITS: "{{ config.dpo_config.dataset_train_splits }}"
            CHAT_TEMPLATE_NAME: "{{ config.dpo_config.chat_template_name }}"
            OUTPUT_DIR: "/output/{{ config.dpo_config.build_name }}"
            NUM_TRAIN_EPOCHS: "{{ config.dpo_config.num_train_epochs }}"
            PER_DEVICE_TRAIN_BATCH_SIZE: "{{ config.dpo_config.per_device_train_batch_size }}"
            GRADIENT_ACCUMULATION_STEPS: "{{ config.dpo_config.gradient_accumulation_steps }}"
            LR: "{{ config.dpo_config.learning_rate }}"
            LR_SCHEDULER_TYPE: "{{ config.dpo_config.lr_scheduler_type }}"
            DPO_BETA: "{{ config.dpo_config.dpo_beta }}"
            DPO_LOSS_TYPE: "{{ config.dpo_config.dpo_loss_type }}"
            MAX_SEQ_LENGTH: "{{ config.dpo_config.max_seq_length }}"
            MAX_PROMPT_LENGTH: "{{ config.dpo_config.max_prompt_length }}"
            SEED: "{{ config.dpo_config.seed }}"
            WITH_TRACKING: "{{ config.dpo_config.with_tracking }}"
            REPORT_TO: "{{ config.dpo_config.report_to }}"
            WANDB_PROJECT: "{{ config.dpo_config.wandb_project }}"
            WANDB_API_KEY: "{{ config.dpo_config.wandb_api_key }}"
            LOGGING_STEPS: "{{ config.dpo_config.logging_steps }}"
            SHORT_NAME: "{{ config.dpo_config.short_name }}"
          setup: |
            source deactivate 2>/dev/null || true
            export PATH=/opt/miniconda3/bin:$PATH

            # Single-GPU accelerate config (no FSDP overhead) — this step
            # defaults to accelerators: "A10G:1", so no FSDP config ships in
            # the image for it. Mirrors rm-training's AWS setup step.
            cat > /stage/configs/single_gpu_accelerate.yaml <<'ACCEOF'
            compute_environment: LOCAL_MACHINE
            distributed_type: 'NO'
            mixed_precision: bf16
            num_processes: 1
            num_machines: 1
            main_training_function: main
            ACCEOF

            echo "=== Environment Check ==="
            python -c "import torch; print(f'PyTorch {torch.__version__}, CUDA {torch.version.cuda}, GPUs: {torch.cuda.device_count()}')"
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader

            if [[ -n "${HF_TOKEN}" ]]; then
              huggingface-cli login --token "${HF_TOKEN}"
            fi

            if [[ -d "${MODEL_PATH}" ]]; then
              echo "Model already available at local path: ${MODEL_PATH}"
            else
              python -c "from huggingface_hub import snapshot_download; snapshot_download('${MODEL_PATH}', ignore_patterns=['*.gguf']); print('Model downloaded successfully')"
            fi

            if [[ -n "${WANDB_API_KEY}" ]]; then
              pip install wandb -q 2>/dev/null || true
              wandb login "${WANDB_API_KEY}" 2>/dev/null || true
            fi
          run: |
            set -eo pipefail
            source deactivate 2>/dev/null || true
            export PATH=/opt/miniconda3/bin:$PATH
            export PYTHONPATH=/stage:$PYTHONPATH
            cd /stage

            NUM_GPUS=$SKYPILOT_NUM_GPUS_PER_NODE

            timestamp=$(date +"%Y%m%d_%H%M%S")
            OUTPUT_MODEL_PATH="${OUTPUT_DIR}/v0-${timestamp}"
            EXPERIMENT_NAME="${SHORT_NAME}_${timestamp}"

            mkdir -p "${OUTPUT_MODEL_PATH}" 2>/dev/null || true

            echo "[$(date)] Starting DPO training"
            echo "[$(date)] Model: ${MODEL_PATH}"
            echo "[$(date)] Output: ${OUTPUT_MODEL_PATH}"
            echo "[$(date)] GPUs: ${NUM_GPUS}"

            TRAIN_ARGS=(
              open_instruct/dpo_tune_cache.py
              --model_name_or_path "${MODEL_PATH}"
              --dataset_mixer_list "${DATASET_MIXER_LIST}"
              --dataset_train_splits "${DATASET_TRAIN_SPLITS}"
              --chat_template_name "${CHAT_TEMPLATE_NAME}"
              --per_device_train_batch_size "${PER_DEVICE_TRAIN_BATCH_SIZE}"
              --gradient_accumulation_steps "${GRADIENT_ACCUMULATION_STEPS}"
              --learning_rate "${LR}"
              --lr_scheduler_type "${LR_SCHEDULER_TYPE}"
              --num_train_epochs "${NUM_TRAIN_EPOCHS}"
              --dpo_beta "${DPO_BETA}"
              --dpo_loss_type "${DPO_LOSS_TYPE}"
              --max_seq_length "${MAX_SEQ_LENGTH}"
              --max_prompt_length "${MAX_PROMPT_LENGTH}"
              --output_dir "${OUTPUT_MODEL_PATH}"
              --logging_steps "${LOGGING_STEPS}"
              --exp_name "${EXPERIMENT_NAME}"
              --seed "${SEED}"
              --no_try_launch_beaker_eval_jobs
            )

            if [[ "${WITH_TRACKING}" == "true" ]]; then
              TRAIN_ARGS+=(--with_tracking --report_to "${REPORT_TO}")
              [[ -n "${WANDB_PROJECT}" ]] && TRAIN_ARGS+=(--wandb_project_name "${WANDB_PROJECT}")
            else
              TRAIN_ARGS+=(--no_push_to_hub)
            fi

            accelerate launch \
              --mixed_precision bf16 \
              --num_machines 1 \
              --num_processes "${NUM_GPUS}" \
              --machine_rank 0 \
              --main_process_ip localhost \
              --main_process_port 29500 \
              --config_file /stage/configs/single_gpu_accelerate.yaml \
              "${TRAIN_ARGS[@]}" 2>&1 | tee "${OUTPUT_MODEL_PATH}/training.log"

            echo "[$(date)] Training complete. Output at: ${OUTPUT_MODEL_PATH}"
            echo "LLMB_ARTIFACT_ID:checkpoint LLMB_ARTIFACT_PATH:${OUTPUT_MODEL_PATH}"
    monitors:
      skypilot_monitor:
        type: skypilot_monitor
        config:
          poll_interval_seconds: 30
          event_configs:
          - event_type: TERMINATE_EVENT
            line_regex: "HFValidationError:"
            is_json: False
            event_fields:
              - field_name: msg
                field_regex: ".*"
          - event_type: TERMINATE_EVENT
            line_regex: "ValueError:"
            is_json: False
            event_fields:
              - field_name: msg
                field_regex: ".*"
          - event_type: TERMINATE_EVENT
            line_regex: "CUDA\\sout\\sof\\smemory"
            is_json: False
            event_fields:
              - field_name: msg
                field_regex: ".*"
          - event_type: WORKLOAD_STATUS_EVENT
            line_regex: "Step:\\s\\d+"
            event_fields:
              - field_name: status
                field_value_template: "RUNNING"
              - field_name: message
                field_regex: "Step:.+"
                is_data: True
