# Build-test fixture for misc/hf-export on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_misc_hf_export.py and buildtest.yaml beside this file.
# Every input comes from the Hub (public granite models, or a PRIVATE
# ibm-granite/gb-step-*-buildtest-inputs-* repo); every output is pushed to a
# per-run private gb-step-*-buildtest-output-* dataset the test verifies and deletes.
granite.build:
  name: slurm-bluevela-hf-export-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    export:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # A logit-distill output dir from 2 ranks x 2 steps: checkpoint-1, checkpoint-2,
        # each with ZeRO optimizer shards and per-rank rng_state files. Staged once.
        train_output:
          uri: "hf:///datasets/ibm-granite/gb-step-aux-buildtest-inputs-hf-export"
          type: model
        # The tokenizer the run trained with, so the export can assert it ships that one.
        expected_tokenizer:
          uri: "hf:///datasets/ibm-granite/gb-step-train-distill-buildtest-inputs-shared-retagged/main/retagged_student"
          type: model
      outputs:
        hf_model:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-aux-buildtest-output-hf-export-hf-model___GBTEST_HF_PUSH_RUN__"
          type: model
          store_push:
            config:
              hf:
                use_resource_group: false
      steps:
        - step_uri: space://steps/aux/hf-export
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 64
              sbatch_options:
                constraint: null
            export_config:
              dest: "export"
              # Named, so the test always ships the same checkpoint.
              checkpoint: "checkpoint-1"
              padding_side: "right"
              verify: true
              # A multi-rank checkpoint carries per-rank rng_state files the classifier
              # does not list; the step's own default stays false.
              allow_unknown: true
