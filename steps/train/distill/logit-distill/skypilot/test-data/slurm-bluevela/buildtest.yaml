# YAML spec for test_skypilot_slurm_bluevela_train_distill_logit_distill.py (located by the
# test/ <-> test-data/ helper; see steps/README.md). env:// inputs and outputs are
# shared-FS no-ops on BlueVela, so every target records exactly one step.
targets:
  - align
  - corpus
  - train-gold
target_expectations:
  - target_name: align
    step_count: 1
    input_artifact_count: 3
    output_artifact_count: 3
  - target_name: corpus
    step_count: 1
    input_artifact_count: 2
    output_artifact_count: 1
- target_name: train-gold
  # Three inputs (student, corpus, teacher), one checkpoint out.
  step_count: 1
  input_artifact_count: 3
  output_artifact_count: 1
  expected_steps:
      - metadata_matches:
          distill_code_commit: "^[0-9a-f]{40}$"
          distill_code_source: "^baked-image$"
config:
  gold_config:
    run_name: "buildtest"
    # The two settings whose wrong value corrupts a run silently.
    use_liger_fused_jsd: false
    vllm_num_servers: 0
space_uri: ../../space
tests:
  - runner
# No injected failure: a failed launch or workload fails the build, so SUCCESS is
# itself the proof.
simulate_step_failure: false
# cpu/gpu-mid queueing on a shared cluster, plus a one-time .sqsh import of a new
# image tag (a CPU job that has queued for over an hour).
timeout_minutes: 240
