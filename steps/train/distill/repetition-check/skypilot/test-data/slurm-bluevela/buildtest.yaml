# YAML spec for test_skypilot_slurm_bluevela_train_distill_repetition_check.py (located by the
# test/ <-> test-data/ helper; see steps/README.md). Each hf:// input is pulled by its
# own hfpull step and each hf:// output pushed by its own hfpush step, which is what
# step_count counts.
targets:
  - gen-smoke
target_expectations:
  - target_name: gen-smoke
    # 1 hfpull + the step + 1 hfpush.
    step_count: 3  # CALIBRATE against the first green run
    input_artifact_count: 1
    output_artifact_count: 1
    expected_steps:
      - step_uri: space://steps/train/distill/repetition-check
        config:
          gen_smoke_config:
            new_tokens: 64
            gate_final_rung: false
space_uri: ../../space
tests:
  - runner
# No injected failure: a failed launch or workload fails the build, so SUCCESS is
# itself the proof.
simulate_step_failure: false
# cpu/gpu-mid queueing on a shared cluster, plus a one-time .sqsh import of a new
# image tag (a CPU job that has queued for over an hour).
timeout_minutes: 120
