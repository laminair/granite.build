# YAML spec for test_skypilot_slurm_bluevela_train_distill_student_sft.py (located by the
# test/ <-> test-data/ helper; see steps/README.md). Each hf:// input is pulled by its
# own hfpull step and each hf:// output pushed by its own hfpush step, which is what
# step_count counts.
targets:
  - train-sft
target_expectations:
  - target_name: train-sft
    # 2 hfpull + the step + 1 hfpush.
    step_count: 4  # CALIBRATE against the first green run
    input_artifact_count: 2
    output_artifact_count: 1
    expected_steps:
      - step_uri: space://steps/train/distill/student-sft
        metadata_matches:
          distill_code_commit: "^[0-9a-f]{40}$"
          distill_code_source: "^baked-image$"
        config:
          sft_config:
            precomputed_logits_dir: ""
            max_length: 4096
          workload:
            gpus_per_node: 1
            nodes: 1
space_uri: ../../space
tests:
  - runner
# No injected failure: a failed launch or workload fails the build, so SUCCESS is
# itself the proof.
simulate_step_failure: false
# cpu/gpu-mid queueing on a shared cluster, plus a one-time .sqsh import of a new
# image tag (a CPU job that has queued for over an hour).
timeout_minutes: 240
