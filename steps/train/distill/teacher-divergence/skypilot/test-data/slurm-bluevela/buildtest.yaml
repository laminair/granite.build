# YAML spec for test_skypilot_slurm_bluevela_train_distill_teacher_divergence.py (located by the
# test/ <-> test-data/ helper; see steps/README.md). env:// inputs and outputs are
# shared-FS no-ops on BlueVela, so every target records exactly one step.
targets:
  - align
  - corpus
  - eval-transfer-baseline
target_expectations:
  - target_name: align
    step_count: 1
    input_artifact_count: 3
    output_artifact_count: 3
  - target_name: corpus
    step_count: 1
    input_artifact_count: 2
    output_artifact_count: 1
- target_name: eval-transfer-baseline
  # Three inputs (student, corpus as the ordering edge, teacher), one fileset out.
  step_count: 1
  input_artifact_count: 3
  output_artifact_count: 1
  expected_steps:
      - metadata_matches:
          distill_code_commit: "^[0-9a-f]{40}$"
          distill_code_source: "^baked-image$"
config:
  eval_config:
    # A waived check or a shorter budget yields a number that means nothing.
    allow_tokenizer_mismatch: false
    max_length: 4096
    metrics: "jsd,kld,rkld,entropy"
space_uri: ../../space
tests:
  - runner
# No injected failure: a failed launch or workload fails the build, so SUCCESS is
# itself the proof.
simulate_step_failure: false
# cpu/gpu-mid queueing on a shared cluster, plus a one-time .sqsh import of a new
# image tag (a CPU job that has queued for over an hour).
timeout_minutes: 240
