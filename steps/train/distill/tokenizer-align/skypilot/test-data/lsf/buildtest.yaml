# YAML-driven spec for test_skypilot_lsf_distill_tokenizer_align.py (located by the
# test/ <-> test-data/ helper, so the pairing holds in both test modes; see
# steps/README.md).
#
# Runs the tokenizer-align step (space://steps/train/distill/tokenizer-align) on the
# SkyPilot LSF/BlueVela environment, proving the launch path end to end: the shared
# distillation CPU image, the two overlays built,
# the student retagged, the ChatML post-condition asserted, and THREE artifacts
# registered — the count is the point, since an undeclared output is dropped silently.
targets:
  - align
target_expectations:
  - target_name: align
    # One workload. The env:// input pulls and output pushes are shared-FS no-ops,
    # so the two named inputs (teacher, student) and all three outputs register
    # off their URI strings with no extra pull/push step.
    step_count: 1
    input_artifact_count: 2
    output_artifact_count: 3
    expected_steps:
      # The step records which trainer package ran: the commit the image's copy came from,
      # and that it came from the image. Asserting both keeps the lineage hook honest — a
      # run that cannot say which code produced these tokenizers is a run whose four
      # downstream consumers cannot be audited.
      - metadata_matches:
          distill_code_commit: "^[0-9a-f]{40}$"
          distill_code_source: "^baked-image$"
        config:
          align_config:
            # Pin the two settings whose wrong value corrupts the run silently rather
            # than failing it: verify off would skip the post-condition that catches a
            # backend disagreeing with tokenizer.json, and a dry run publishes nothing.
            verify: true
            dry_run: false
space_uri: ../../space
tests:
  - runner
# No injected failure — a failed source resolution, overlay build, retag or
# post-condition fails the build, so reaching SUCCESS is itself the proof.
simulate_step_failure: false
# Budget for LSF queue time on a shared cluster, plus a cold enroot import of the
# CPU image on a node that has not run it yet.
timeout_minutes: 60
