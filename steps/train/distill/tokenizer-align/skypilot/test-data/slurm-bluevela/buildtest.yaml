# YAML spec for test_skypilot_slurm_bluevela_train_distill_tokenizer_align.py (located by the
# test/ <-> test-data/ helper; see steps/README.md). Each hf:// input is pulled by its
# own hfpull step and each hf:// output pushed by its own hfpush step, which is what
# step_count counts.
targets:
  - align
target_expectations:
  - target_name: align
    # 3 hfpull + the step + 3 hfpush.
    step_count: 7  # CALIBRATE against the first green run
    input_artifact_count: 3
    output_artifact_count: 3
    expected_steps:
      - step_uri: space://steps/train/distill/tokenizer-align
        metadata_matches:
          distill_code_commit: "^[0-9a-f]{40}$"
          distill_code_source: "^baked-image$"
        config:
          align_config:
            # verify off would skip the post-condition; a dry run publishes nothing.
            verify: true
            dry_run: false
            require_chatml: false
space_uri: ../../space
tests:
  - runner
# No injected failure: a failed launch or workload fails the build, so SUCCESS is
# itself the proof.
simulate_step_failure: false
# cpu/gpu-mid queueing on a shared cluster, plus a one-time .sqsh import of a new
# image tag (a CPU job that has queued for over an hour).
timeout_minutes: 180
