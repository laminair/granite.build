# Build-test fixture for data-mixture on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_train_distill_data_mixture.py and buildtest.yaml beside this file.
# Every input comes from the Hub (public granite models, or a PRIVATE
# ibm-granite/gb-step-*-buildtest-inputs-* repo); every output is pushed to a
# per-run private gb-step-*-buildtest-output-* dataset the test verifies and deletes.
granite.build:
  name: slurm-bluevela-data-mixture-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    sources:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # Bound only to be pulled: sources_config.sources lists the pulled paths.
        general:
          uri: "hf:///datasets/ibm-granite/gb-step-train-distill-buildtest-inputs-data-mixture/main/general.jsonl"
          type: dataset
        tools:
          uri: "hf:///datasets/ibm-granite/gb-step-train-distill-buildtest-inputs-data-mixture/main/tools.jsonl"
          type: dataset
      outputs:
        corpus_source:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-train-distill-buildtest-output-data-mixture-corpus-source___GBTEST_HF_PUSH_RUN__"
          type: dataset
          store_push:
            config:
              hf:
                use_resource_group: false
      steps:
        - step_uri: space://steps/train/distill/data-mixture
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 32
              sbatch_options:
                constraint: null
            sources_config:
              sources:
                - "{{ bindings.general.binding.path }}"
                - "{{ bindings.tools.binding.path }}"
              target_rows: 32
              shuffle_seed: 42
              output_dir: "sources"
