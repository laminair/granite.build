# Build-test fixture for data-validate on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_train_distill_data_validate.py and buildtest.yaml beside this file.
# Every input comes from the Hub (public granite models, or a PRIVATE
# ibm-granite/gb-step-distillation-buildtest-inputs-* repo); every output is pushed
# to a per-run private dataset the test verifies and then deletes.
granite.build:
  name: slurm-bluevela-data-validate-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    pin-check:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # The whole staged corpus repo: manifest + train + eval.
        pinned_corpus:
          uri: "hf:///datasets/ibm-granite/gb-step-distillation-buildtest-inputs-corpus"
          type: dataset
        # tokenizer-align's retagged student, staged once (see the repo's README).
        tokenizer:
          uri: "hf:///datasets/ibm-granite/gb-step-distillation-buildtest-inputs-retagged/main/retagged_student"
          type: model
        # Bound so the step can name the teacher the corpus was built against.
        teacher:
          uri: "hf:///models/ibm-granite/granite-4.1-3b"
          type: model
      outputs:
        pin_check:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-distillation-buildtest-pin-check___GBTEST_HF_PUSH_RUN__"
          type: fileset
      steps:
        - step_uri: space://steps/train/distill/data-validate
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 32
              sbatch_options:
                constraint: null
            pin_check_config:
              # These MUST equal what the staged corpus was built with (its README),
              # or the check (correctly) refuses.
              corpus_dir: "{{ bindings.pinned_corpus.binding.path }}"
              teacher_model: "{{ bindings.teacher.binding.path }}"
              max_length: 4096
              think_policy: "keep"
              documents_policy: "keep"
              eval_fraction: 0.25
              output_dir: "corpus-pin"
