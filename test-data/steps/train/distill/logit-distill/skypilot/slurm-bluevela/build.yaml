# Build-test fixture for logit-distill on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_train_distill_logit_distill.py and buildtest.yaml beside this file.
# Plumbing scale: what SUCCESS proves is in the test's docstring.
granite.build:
  name: slurm-bluevela-logit-distill-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    align:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        teacher:
          uri: "env:///proj/granite-build/g4os/models/granite-4.1-3b-pinned"
          type: model
        student:
          uri: "env:///proj/granite-build/g4os/skypilot-test/sft/checkpoints/v0-20260529-20260529_212150-hf/epoch_hf_2"
          type: model
        # The granite-native template with a real {% generation %} block: without
        # it prep cannot build assistant masks.
        chat_template:
          uri: "env:///proj/granite-build/g4os/chat_templates/granite_4_role_generation.jinja"
          type: dataset
      outputs:
        retagged_student:
          uri: "env://{{ binding.path }}"
          type: model
        teacher_overlay:
          uri: "env://{{ binding.path }}"
          type: model
        student_overlay:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/train/distill/tokenizer-align
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 32
              sbatch_options:
                constraint: null
            align_config:
              out_dir: "/proj/granite-build/g4os/gbtest/distill/buildtest/logit-distill/{{ run_metadata.build_id }}/align"
              # False for this granite-4.x pair, which carries start_of_role/end_of_role
              # and no im_start; safe only because the chat template is granite-native.
              require_chatml: false
              verify: true
              dry_run: false

    corpus:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        tokenizer:
          binding: align.retagged_student
        source_dataset:
          uri: "env:///proj/granite-build/g4os/gbtest/gold-distill-smoke/smoke_2000_nothink.jsonl"
          type: dataset
      outputs:
        corpus:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/train/distill/data-prep
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 32
              sbatch_options:
                constraint: null
            corpus_config:
              # Absolute and build-unique: other targets name eval.jsonl or the corpus
              # dir by path, and every target run gets its own GB_BUILD_WORKDIR.
              out_dir: "/proj/granite-build/g4os/gbtest/distill/buildtest/logit-distill/{{ run_metadata.build_id }}/corpus"
              max_length: 4096
              think_policy: "keep"
              completion_boundary: "last_message"
              # Above zero: the eval split must exist for teacher-divergence.
              eval_fraction: 0.25
              max_examples: 64
              emit_row_id: true
              # keep: the granite 4.x template renders documents into the system turn.
              documents_policy: "keep"
              seed: 42

    train-gold:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        student:
          binding: align.retagged_student
        corpus:
          binding: corpus.corpus
        teacher:
          uri: "env:///proj/granite-build/g4os/models/granite-4.1-3b-pinned"
          type: model
      outputs:
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/train/distill/logit-distill
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 2
            launcher_config:
              resources:
                # accelerators is per node; H200 is what the env's constraint pins.
                accelerators: "H200:2"
                cluster: "bluevela"
                zone: "gpu-mid"
                memory: 256
            gold_config:
              run_name: "buildtest"
              ds_config: "configs/deepspeed/accelerate_deepspeed_zero3.yaml"
              num_train_epochs: 1.0
              max_steps: 2
              learning_rate: 2.0e-06
              min_lr: 2.0e-07
              warmup_ratio: 0.05
              lr_scheduler_type: "cosine_with_min_lr"
              per_device_train_batch_size: 1
              gradient_accumulation_steps: 1
              max_length: 4096
              max_completion_length: 1024
              gradient_checkpointing: true
              save_strategy: "steps"
              save_steps: 1
              save_total_limit: 2
              logging_steps: 1
              dataset_num_proc: 8
              temperature: 1.0
              lmbda: 0.0
              beta: 0.5
              use_liger_fused_jsd: false
              response_template: "<|start_of_role|>assistant<|end_of_role|>"
              vllm_num_servers: 0
