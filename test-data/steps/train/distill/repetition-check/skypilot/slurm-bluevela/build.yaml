# Build-test fixture for repetition-check on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_train_distill_repetition_check.py and buildtest.yaml beside this file.
# Every input comes from the Hub (public granite models, or a PRIVATE
# ibm-granite/gb-step-*-buildtest-inputs-* repo); every output is pushed to a
# per-run private gb-step-*-buildtest-output-* dataset the test verifies and deletes.
granite.build:
  name: slurm-bluevela-repetition-check-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    gen-smoke:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # The DENSE pinned teacher, not the hybrid student: this step runs with HF_HUB_OFFLINE=1, and a granitemoehybrid load fetches Hub kernels the offline mode forbids. Bound only to be pulled: the rung below names the pulled path.
        rung:
          uri: "hf:///datasets/ibm-granite/gb-step-train-distill-buildtest-inputs-shared-teacher"
          type: model
      outputs:
        repetition_report:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-train-distill-buildtest-output-repetition-check-report___GBTEST_HF_PUSH_RUN__"
          type: fileset
          store_push:
            config:
              hf:
                use_resource_group: false
      steps:
        - step_uri: space://steps/train/distill/repetition-check
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
            launcher_config:
              resources:
                # accelerators is per node; H200 is what the env's constraint pins.
                accelerators: "H200:1"
                cluster: "bluevela"
                zone: "gpu-mid"
                memory: 256
            gen_smoke_config:
              rungs:
                - "0:{{ bindings.rung.binding.path }}"
              max_repetition: 0.15
              new_tokens: 64
              # The verdict is not the subject here; the run and the report are.
              gate_final_rung: false
              output_dir: "gen-smoke"
