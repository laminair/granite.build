# Build-test fixture for tokenizer-align on BlueVela SLURM; paired with
# test_skypilot_slurm_bluevela_train_distill_tokenizer_align.py and buildtest.yaml beside this file.
# Every input comes from the Hub (public granite models, or a PRIVATE
# ibm-granite/gb-step-distillation-buildtest-inputs-* repo); every output is pushed
# to a per-run private dataset the test verifies and then deletes.
granite.build:
  name: slurm-bluevela-tokenizer-align-buildtest
  # A failure here is final: a retry would only hide a flaky launch path.
  retries:
    max_retries: 0
  targets:
    align:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        teacher:
          uri: "hf:///models/ibm-granite/granite-4.1-3b"
          type: model
        student:
          uri: "hf:///models/ibm-granite/granite-4.0-h-350m"
          type: model
        # The granite-native template with real {% generation %} blocks.
        chat_template:
          uri: "hf:///datasets/ibm-granite/gb-step-distillation-buildtest-inputs-tokenizer-align/main/granite_4_role_generation.jinja"
          type: dataset
      outputs:
        retagged_student:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-distillation-buildtest-align-retagged___GBTEST_HF_PUSH_RUN__"
          type: model
        teacher_overlay:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-distillation-buildtest-align-teacher-overlay___GBTEST_HF_PUSH_RUN__"
          type: model
        student_overlay:
          uri: "hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/gb-step-distillation-buildtest-align-student-overlay___GBTEST_HF_PUSH_RUN__"
          type: model
      steps:
        - step_uri: space://steps/train/distill/tokenizer-align
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 4
            launcher_config:
              resources:
                cluster: "bluevela"
                # BlueVela's CPU lane: gpu-mid refuses a GPU-less job, and the env-wide
                # h200 constraint has to go with it (null drops the directive).
                zone: "cpu"
                memory: 32
              sbatch_options:
                constraint: null
            align_config:
              out_dir: "align"
              # False for this granite-4.x pair, which carries start_of_role/end_of_role
              # and no im_start; safe only because the chat template is granite-native.
              require_chatml: false
              verify: true
              dry_run: false
